name: List Branches
description: List git branches from a repository path

inputs:
  path:
    description: Path to the git repository
    required: false
    default: "."
  pattern:
    description: Glob-like branch name pattern (for example, feature/*)
    required: false
    default: "*"
  includes_remote:
    description: Include remote origin branches (including branches that exist only on remote)
    required: false
    default: "false"

outputs:
  branches:
    description: JSON array of matching branch names
    value: ${{ steps.list.outputs.branches }}

runs:
  using: composite
  steps:
    - name: List Branches
      id: list
      shell: bash
      run: |
        set -euo pipefail

        repo_path='${{ inputs.path }}'
        pattern='${{ inputs.pattern }}'
        includes_remote='${{ inputs.includes_remote }}'

        if [ ! -d "$repo_path" ]; then
          echo "Repository path not found: $repo_path" >&2
          exit 1
        fi

        if ! git -C "$repo_path" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Not a Git repository: $repo_path" >&2
          exit 1
        fi

        mapfile -t local_branches < <(
          git -C "$repo_path" branch --format='%(refname:short)' --list "$pattern" | awk 'NF'
        )

        branches=("${local_branches[@]}")

        if [ "$includes_remote" = "true" ]; then
          mapfile -t remote_branches < <(
            git -C "$repo_path" for-each-ref --format='%(refname:short)' "refs/remotes/origin/${pattern}" \
              | sed 's#^origin/##' \
              | awk 'NF && $0 != "HEAD"'
          )

          if [ "${#remote_branches[@]}" -gt 0 ]; then
            mapfile -t branches < <(
              printf '%s\n' "${branches[@]}" "${remote_branches[@]}" | awk 'NF' | sort -u
            )
          fi
        fi

        if [ "${#branches[@]}" -eq 0 ]; then
          echo "No branches found."
          echo 'branches=[]' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branches_json=$(jq --compact-output --null-input '$ARGS.positional' --args "${branches[@]}")

        echo "branches=${branches_json}" >> "$GITHUB_OUTPUT"
        echo "Found branches: ${branches_json}"
